spring.application.name=password-manager
server.port=8080

spring.mongodb.uri=mongodb://localhost:27017/passwordmanager
spring.data.mongodb.database=passwordmanager
spring.data.mongodb.auto-index-creation=true

# No default on purpose: the app will not start unless JWT_SECRET is set
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=300000

app.cors.origin=http://localhost:5173

# Never leak internals in error responses
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Refresh sessions: each token lasts 12h, and a sign-in can never last more than 24h in total
app.refresh.ttl-hours=12
app.refresh.max-session-hours=24

# Refresh cookie. In production over HTTPS set secure=true.
app.cookie.secure=false
app.cookie.same-site=Strict